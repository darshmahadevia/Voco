[package]
name = "voco"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Private, local dictation for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.16"
crossbeam-channel = "0.5"
fs2 = "0.4"
hound = "3.5"
moonshine-rs = { version = "=0.2.6", default-features = false }
parakeet-rs = { version = "=0.4.1", default-features = false, features = ["cpu"] }
# Use the ONNX Runtime bundled by moonshine-sys instead of linking a second copy.
ort-sys = { version = "=2.0.0-rc.14", default-features = false, features = ["disable-linking"] }
whisper-rs = { version = "0.16", features = ["metal"] }
ureq = "2.12"
url = "2"
sha2 = { version = "0.10", features = ["asm"] }
crc32c = "0.6"
base64 = "0.22"
tempfile = "3"
libc = "0.2"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSPasteboard", "NSRunningApplication"] }
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
lto = "thin"

[profile.release.build-override]
debug = true
strip = "none"
