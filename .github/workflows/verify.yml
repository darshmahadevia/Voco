name: Verify Voco

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check scripts and app metadata
        run: |
          bash -n scripts/*.sh
          plutil -lint Resources/Info.plist
      - name: Test dictation behavior
        run: ./scripts/test.sh
      - name: Check transcript recovery lifecycle
        run: ./scripts/check-recovery.sh
      - name: Check Electron cursor resolution
        run: ./scripts/check-focus.sh
      - name: Build and verify the signed release app
        run: ./scripts/build.sh
